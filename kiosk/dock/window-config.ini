# GNOME Kiosk window rules for the Art Kit. Keys: CONFIG.md in gnome-kiosk 51.
# install.sh puts the screen name (for example eDP-1) in place of MONITOR.
# Big numbers on purpose: lock-on-monitor-area cuts them to the screen.

# All windows on one layer: the window that the dock raises comes to the front.
[all]
set-above=false

# Apps: not fullscreen, as big as the screen. The strut keeps them above the dock.
[apps]
match-window-type=normal
set-fullscreen=false
set-x=0
set-y=0
set-width=10000
set-height=10000

# The dock: a bar at the bottom edge. Other windows do not cover it (strut).
[dock]
match-class=org.artkit.Dock
set-window-type=dock
set-on-monitor=MONITOR
lock-on-monitor-area=0,0 10000x10000
set-x=0
set-y=10000
set-width=10000
set-height=80
set-strut=bottom
set-above=true
lock-move=true
lock-resize=true
